# Configuracion exclusiva para pruebas: NO utiliza ./datos/petcare
spring.datasource.url=jdbc:h2:mem:petcare_pruebas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# No se usara la API real ni correo durante las pruebas.
petcare.api-externa.url=http://localhost:3001
petcare.api-externa.key=
